nelmio_api_doc:
    documentation:
        info:
            title: Back2Tournament API
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
            schemas:
                Error:
                    type: object
                    properties:
                        error:
                            type: string
                            description: Human-readable reason for the failure
                Uuid:
                    type: object
                    description: An identifier, serialized as a value object
                    properties:
                        value: { type: string, format: uuid }
                Article:
                    type: object
                    description: 'A blog article. A draft is read by editors only; once published it is public. `author` is the user who published it — not the one who wrote it — and `category` the category it is filed under. Its comments are not part of it.'
                    properties:
                        category: { $ref: '#/components/schemas/Uuid' }
                        id: { $ref: '#/components/schemas/Uuid' }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        body: { type: string }
                        title: { type: string }
                        status:
                            type: string
                            enum: [draft, published]
                            description: '`draft` until an editor publishes it.'
                        publishedAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: 'When the article was published. Null for a draft.'
                        author:
                            type: object
                            nullable: true
                            description: 'The user who published the article. Null for a draft.'
                            properties:
                                value: { type: string, format: uuid }
                        authorName:
                            type: string
                            nullable: true
                            example: 'demo'
                            description: 'The username of `author`. Null for a draft.'
                        titleEn:
                            type: string
                            nullable: true
                            example: 'The weekend results'
                            description: 'The English title. The English version is whole: `titleEn` and `bodyEn` are both set, or both null when the article is in French only.'
                        bodyEn:
                            type: string
                            nullable: true
                            description: 'The English body, null when the article is in French only.'
                Comment:
                    type: object
                    description: 'A comment on an article.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        message: { type: string }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        articleId: { $ref: '#/components/schemas/Uuid' }
                        author:
                            type: object
                            nullable: true
                            description: 'The user who wrote the comment. Null for a comment older than authorship.'
                            properties:
                                value: { type: string, format: uuid }
                        authorName:
                            type: string
                            nullable: true
                            example: 'rival01'
                            description: 'The username of `author`.'
                Category:
                    type: object
                    description: 'A blog category. Unlike other resources, its id is a plain string, not a value object.'
                    properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                CurrentUser:
                    type: object
                    description: 'The authenticated user, with the player profiles they hold. Unlike other resources, identifiers here are plain strings, not value objects.'
                    required: [id, email, username, roles, verified, players]
                    properties:
                        id: { type: string, format: uuid }
                        email: { type: string, format: email }
                        username: { type: string }
                        roles:
                            type: array
                            items: { type: string, example: ROLE_USER }
                        verified: { type: boolean }
                        players:
                            type: array
                            description: 'One entry per game the user holds a player profile in, oldest first. Empty when they hold none.'
                            items:
                                type: object
                                required: [id, battletag, game]
                                properties:
                                    id: { type: string, format: uuid }
                                    battletag: { type: string, example: 'PlayerOne#1234' }
                                    game: { type: string, format: uuid, description: Game ID }
                Game:
                    type: object
                    description: A game players can register in
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        title: { type: string }
                        teamSizes:
                            type: array
                            description: 'The formats the game is played in, as the number of players per side: `[1]` for 1v1 only, `[1, 2, 3]` for 1v1, 2v2 and 3v3. Teams, fights and tournaments only use these.'
                            items: { type: integer, minimum: 1, maximum: 64 }
                            example: [1, 2, 3]
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                Player:
                    type: object
                    description: 'One user in one game. `user` names the account, `game` the game.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        battletag: { type: string }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        game: { $ref: '#/components/schemas/Uuid' }
                        user: { $ref: '#/components/schemas/Uuid' }
                Result:
                    type: object
                    description: What one side of a fight scored, and where that claim stands
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        fight: { $ref: '#/components/schemas/Uuid' }
                        competitor: { $ref: '#/components/schemas/Uuid' }
                        score:
                            type: integer
                            minimum: 0
                            example: 3
                            description: 'Points this side scored. Zero until a declaration carries a real value.'
                        status:
                            type: string
                            enum: [pending, reporting, win, loss, draw]
                            description: '`pending` while nobody declared anything, `reporting` while one side waits for the other to confirm, then the settled outcome.'
                        reportedStatus:
                            type: string
                            nullable: true
                            enum: [win, loss, draw]
                            description: 'The outcome the declaring side claims. Carried only while `status` is `reporting`.'
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                GamePlayer:
                    description: 'A player profile as the list of a game shows it: with the tag of its clan.'
                    allOf:
                        - { $ref: '#/components/schemas/Player' }
                        - type: object
                          properties:
                              clanTag:
                                  type: string
                                  nullable: true
                                  example: 'B2T'
                                  description: 'The tag of the clan the profile is an active member of. Null for a profile in no clan.'
                PlayerProfile:
                    type: object
                    description: 'A player profile as a list names it: its id and the battletag it goes by.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        battletag:
                            type: string
                            nullable: true
                            example: 'PlayerOne#1234'
                            description: 'How this profile is named in its game.'
                NamedSide:
                    type: object
                    description: 'A competitor, and what it stands for: a player profile in 1v1, a team in NvN.'
                    properties:
                        competitor: { $ref: '#/components/schemas/Uuid' }
                        type:
                            type: string
                            nullable: true
                            enum: [player, team]
                        reference:
                            type: object
                            nullable: true
                            description: 'The player profile or the team this competitor stands for.'
                            properties:
                                value: { type: string, format: uuid }
                        name:
                            type: string
                            nullable: true
                            example: 'PlayerOne#1234'
                            description: 'The battletag of the profile, or the name of the team. Null when it no longer exists.'
                        tag:
                            type: string
                            nullable: true
                            example: 'B2T'
                            description: 'The tag of the clan the side plays for: the clan the profile is an active member of, or the clan of the team. Null for a profile in no clan.'
                FightSide:
                    description: 'One side of a fight, and what it claims or settled on.'
                    allOf:
                        - { $ref: '#/components/schemas/NamedSide' }
                        - type: object
                          properties:
                              score:
                                  type: integer
                                  minimum: 0
                                  example: 3
                                  description: 'Points this side scored. Zero until a declaration carries a real value.'
                              status:
                                  type: string
                                  enum: [pending, reporting, win, loss, draw]
                                  description: '`pending` while nobody declared, `reporting` while the declaration waits for its confirmation, then the settled outcome.'
                              reportedStatus:
                                  type: string
                                  nullable: true
                                  enum: [win, loss, draw]
                                  description: 'The outcome the declaration claims for this side. Carried only while `status` is `reporting`.'
                FightSummary:
                    type: object
                    description: 'A fight between two competitors of the same game and format, where it stands as a whole, and its two sides.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        game: { $ref: '#/components/schemas/Uuid' }
                        teamSize: { type: integer, minimum: 1, example: 1, description: 'Players per side: 1 for a 1v1, 5 for a 5v5' }
                        tournament:
                            type: object
                            nullable: true
                            description: 'The tournament whose bracket holds this fight. Null for a challenge.'
                            properties:
                                value: { type: string, format: uuid }
                        status:
                            type: string
                            enum: [pending, reporting, finished]
                            description: '`pending` while nobody declared anything, `reporting` while a declaration waits for its confirmation, `finished` once both sides are settled.'
                        declaredBy:
                            type: object
                            nullable: true
                            description: 'The competitor that declared the scores. Null while nothing has been declared.'
                            properties:
                                value: { type: string, format: uuid }
                        arbitrated: { type: boolean, description: 'An administrator settled the fight after a dispute, instead of a confirmation by the other side.' }
                        winner:
                            type: object
                            nullable: true
                            description: 'The competitor that won, once `finished`. Null before, and for a draw.'
                            properties:
                                value: { type: string, format: uuid }
                        mySide:
                            type: object
                            nullable: true
                            description: 'The competitor the authenticated user speaks for in this fight — their player profile, or the team they lead. Null for a bystander.'
                            properties:
                                value: { type: string, format: uuid }
                        sides:
                            type: array
                            minItems: 2
                            maxItems: 2
                            description: 'Both sides, in the order the fight holds them.'
                            items: { $ref: '#/components/schemas/FightSide' }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                SettledResult:
                    type: object
                    description: 'A settled fight, told from the side of the player profile or clan it is listed for.'
                    required: [fight, game, teamSize, outcome, side]
                    properties:
                        fight: { $ref: '#/components/schemas/Uuid' }
                        game: { $ref: '#/components/schemas/Uuid' }
                        teamSize: { type: integer, minimum: 1, example: 1, description: 'Players per side: 1 for a 1v1, 5 for a 5v5' }
                        tournament:
                            type: object
                            nullable: true
                            description: 'The tournament whose bracket held this fight. Null for a challenge.'
                            properties:
                                value: { type: string, format: uuid }
                        outcome:
                            type: string
                            enum: [win, loss, draw]
                            description: 'How the fight ended for `side`.'
                        arbitrated: { type: boolean, description: 'An administrator settled the fight after a dispute.' }
                        settledAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: 'When the result was confirmed.'
                        side:
                            description: 'The side the list is about: the player profile or a team it plays in; for a clan, one of its teams or the member who fought the duel. Its `tag` is the tag of the clan it played for in this fight, whichever clan its players are in today.'
                            allOf:
                                - { $ref: '#/components/schemas/NamedSide' }
                                - type: object
                                  properties:
                                      score: { type: integer, minimum: 0, example: 3 }
                        opponent:
                            description: 'The other side of the fight. Its `tag` is the tag of the clan it played for in this fight.'
                            nullable: true
                            allOf:
                                - { $ref: '#/components/schemas/NamedSide' }
                                - type: object
                                  properties:
                                      score: { type: integer, minimum: 0, example: 1 }
                FightPage:
                    type: object
                    required: [items, total, page, limit, pages]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/FightSummary' }
                        total: { type: integer, example: 12, description: 'Fights matching the filters, every page taken together' }
                        page: { type: integer, example: 1 }
                        limit: { type: integer, example: 20 }
                        pages: { type: integer, example: 1, description: '0 when no fight matches' }
                SettledResultPage:
                    type: object
                    required: [items, total, page, limit, pages]
                    properties:
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/SettledResult' }
                        total: { type: integer, example: 12, description: 'Settled fights, every page taken together' }
                        page: { type: integer, example: 1, description: 'The page these items come from' }
                        limit: { type: integer, example: 10, description: 'How many items a full page holds' }
                        pages: { type: integer, example: 2, description: 'How many pages there are, 0 when nothing was settled' }
                Clan:
                    type: object
                    description: 'A group of players of one game, run by its leader. `leader` names the leader''s player profile.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        name: { type: string, example: 'Back to Tournament' }
                        tag: { type: string, example: 'B2T', description: '2 to 5 upper-case letters or digits, unique within the game' }
                        game: { $ref: '#/components/schemas/Uuid' }
                        leader: { $ref: '#/components/schemas/Uuid' }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                ClanSummary:
                    description: 'A clan as a list shows it.'
                    allOf:
                        - { $ref: '#/components/schemas/Clan' }
                        - type: object
                          properties:
                              members: { type: integer, example: 7, description: 'Active members, the leader included; pending invitations are not counted' }
                ClanMember:
                    type: object
                    description: 'The place one player profile holds in one clan: `invited` until they accept, `active` after.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        clan: { $ref: '#/components/schemas/Uuid' }
                        player: { $ref: '#/components/schemas/PlayerProfile' }
                        role: { type: string, enum: [leader, member] }
                        status: { type: string, enum: [invited, active] }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                ClanDetail:
                    description: 'A clan, its members and pending invitations (leader first), and the teams it fields.'
                    allOf:
                        - { $ref: '#/components/schemas/Clan' }
                        - type: object
                          properties:
                              members:
                                  type: array
                                  items: { $ref: '#/components/schemas/ClanMember' }
                              teams:
                                  type: array
                                  items: { $ref: '#/components/schemas/Team' }
                Team:
                    type: object
                    description: 'A lineup a clan fields in one format: exactly `size` players, leader first. The leader speaks for the team in fights and tournaments.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        name: { type: string, example: 'Falcons Duo' }
                        clan: { $ref: '#/components/schemas/Uuid' }
                        game: { $ref: '#/components/schemas/Uuid' }
                        size: { type: integer, minimum: 1, maximum: 64, example: 2 }
                        leader: { $ref: '#/components/schemas/Uuid' }
                        players:
                            type: array
                            items: { $ref: '#/components/schemas/PlayerProfile' }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                TournamentSummary:
                    type: object
                    description: 'A single-elimination tournament of one game, in one format.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        name: { type: string, example: 'Autumn Cup' }
                        game: { $ref: '#/components/schemas/Uuid' }
                        teamSize: { type: integer, minimum: 1, example: 1, description: 'Players per side: 1 registers player profiles, more registers teams of that size' }
                        capacity: { type: integer, minimum: 2, maximum: 128, example: 16 }
                        participantCount: { type: integer, example: 5 }
                        status:
                            type: string
                            enum: [upcoming, ongoing, finished, cancelled]
                            description: '`upcoming` while registrations are open, `ongoing` once the bracket is drawn, `finished` when the final is settled.'
                        organizer: { $ref: '#/components/schemas/Uuid' }
                        startsAt: { type: string, format: date-time }
                        winner:
                            nullable: true
                            description: 'The competitor that won the final. Null until then.'
                            allOf:
                                - { $ref: '#/components/schemas/NamedSide' }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                TournamentParticipant:
                    description: 'A competitor registered in a tournament. The seed is its registration rank.'
                    allOf:
                        - { $ref: '#/components/schemas/NamedSide' }
                        - type: object
                          properties:
                              id: { $ref: '#/components/schemas/Uuid' }
                              tournament: { $ref: '#/components/schemas/Uuid' }
                              seed: { type: integer, minimum: 1, example: 1 }
                              createdAt: { type: string, format: date-time }
                TournamentMatchup:
                    type: object
                    description: 'One slot of the bracket. A side is null until the matchup feeding it is decided, or for good when a seed got a bye.'
                    properties:
                        id: { $ref: '#/components/schemas/Uuid' }
                        round: { type: integer, minimum: 1, example: 1, description: 'The last round is the final' }
                        position: { type: integer, minimum: 0, example: 0, description: 'From the top of the round' }
                        sides:
                            type: array
                            minItems: 2
                            maxItems: 2
                            items:
                                nullable: true
                                allOf:
                                    - { $ref: '#/components/schemas/NamedSide' }
                        fight:
                            type: object
                            nullable: true
                            description: 'The fight both sides play, opened once both are known. Declared and confirmed like any other fight.'
                            properties:
                                value: { type: string, format: uuid }
                        winner:
                            type: object
                            nullable: true
                            properties:
                                value: { type: string, format: uuid }
                TournamentDetail:
                    description: 'A tournament, its participants by seed and, once it started, its bracket round by round.'
                    allOf:
                        - { $ref: '#/components/schemas/TournamentSummary' }
                        - type: object
                          properties:
                              participants:
                                  type: array
                                  items: { $ref: '#/components/schemas/TournamentParticipant' }
                              rounds: { type: integer, example: 3, description: '0 until the bracket is drawn' }
                              matchups:
                                  type: array
                                  items: { $ref: '#/components/schemas/TournamentMatchup' }
                RankedSubject:
                    type: object
                    description: 'Who a ranking entry is about: a player profile, named by its battletag, or a clan, by its name and tag.'
                    properties:
                        type: { type: string, enum: [player, clan] }
                        id: { $ref: '#/components/schemas/Uuid' }
                        name: { type: string, nullable: true, example: 'Demo#1001' }
                        tag: { type: string, nullable: true, example: 'B2T', description: 'The tag of the clan, or of the clan a player profile is an active member of; null for a profile in no clan' }
                RankingEntry:
                    type: object
                    description: 'One place in a ranking. Every rating starts at 1000 and moves by up to 32 points per settled fight (Elo, K = 32).'
                    required: [rank, rating, fights, wins, draws, losses, subject]
                    properties:
                        rank: { type: integer, example: 1, description: 'Equal ratings share a rank: 1, 2, 2, 4…' }
                        rating: { type: integer, example: 1087 }
                        fights: { type: integer, example: 12, description: 'Settled fights counted in the rating' }
                        wins: { type: integer, example: 8 }
                        draws: { type: integer, example: 1 }
                        losses: { type: integer, example: 3 }
                        subject: { $ref: '#/components/schemas/RankedSubject' }
                RankingPage:
                    type: object
                    required: [teamSize, items, total, page, limit, pages]
                    properties:
                        teamSize: { type: integer, minimum: 1, example: 2, description: 'The format of this ranking, as the number of players per side: the one asked for, or the smallest format of the game' }
                        items:
                            type: array
                            items: { $ref: '#/components/schemas/RankingEntry' }
                        total: { type: integer, example: 42, description: 'Ranked player profiles or clans, every page taken together' }
                        page: { type: integer, example: 1, description: 'The page these entries come from' }
                        limit: { type: integer, example: 20, description: 'How many entries a full page holds' }
                        pages: { type: integer, example: 3, description: 'How many pages there are, 0 when nobody is ranked yet' }
                FormatRating:
                    type: object
                    description: 'The Elo rating of a player profile or a clan in one format, and where it stands in the ranking of that format.'
                    required: [teamSize, rank, total, rating, fights, wins, draws, losses]
                    properties:
                        teamSize: { type: integer, minimum: 1, example: 1, description: 'The format, as the number of players per side' }
                        rank: { type: integer, nullable: true, example: 3, description: 'Null until the first settled fight in this format' }
                        total: { type: integer, example: 42, description: 'How many player profiles, or clans, the ranking of this format holds' }
                        rating: { type: integer, example: 1087, description: '1000 until the first settled fight in this format' }
                        fights: { type: integer, example: 12 }
                        wins: { type: integer, example: 8 }
                        draws: { type: integer, example: 1 }
                        losses: { type: integer, example: 3 }
                SubjectRating:
                    type: object
                    description: 'The Elo ratings of one player profile or clan: one per format its game is played in, smallest first.'
                    required: [subject, game, ratings]
                    properties:
                        subject: { $ref: '#/components/schemas/RankedSubject' }
                        game: { $ref: '#/components/schemas/Uuid' }
                        ratings:
                            type: array
                            items: { $ref: '#/components/schemas/FormatRating' }
            responses:
                BadRequest:
                    description: 'Invalid input: a value object rule or a business rule was violated'
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                Unauthorized:
                    description: 'Missing, invalid, expired or revoked JWT'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    code: { type: integer, example: 401 }
                                    message: { type: string, example: 'JWT Token not found' }
                Forbidden:
                    description: 'The user is known but lacks the required role'
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                NotFound:
                    description: 'A resource referenced by the request does not exist'
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
                Conflict:
                    description: 'The resource already exists'
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/Error' }
        security:
            - bearerAuth: []
    areas:
        path_patterns:
            - ^/api(?!/doc)
